name: Deploy Ludno UI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          docker build -t fijispawn/ludno-ui:$COMMIT_HASH .
          docker push fijispawn/ludno-ui:$COMMIT_HASH
          docker tag fijispawn/ludno-ui:$COMMIT_HASH fijispawn/ludno-ui:latest
          docker push fijispawn/ludno-ui:latest

      - name: SSH and redeploy container
        uses: appleboy/ssh-action@v1.0.0
        env:
          UNISENDER_API_KEY: ${{ secrets.UNISENDER_API_KEY }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: UNISENDER_API_KEY
          script: |
            echo "[INFO] Stopping and removing existing container..."
            docker rm -f my-ludno-ui || echo "[INFO] Container not running."

            echo "[INFO] Pulling latest Docker image..."
            docker pull fijispawn/ludno-ui:latest

            echo "[INFO] Starting new container..."
            docker run -d \
              --name my-ludno-ui \
              --restart unless-stopped \
              -p 8080:80 \
              -e UNISENDER_API_KEY="$UNISENDER_API_KEY" \
              -e UNISENDER_LIST_ID=5 \
              fijispawn/ludno-ui:latest

            echo "[SUCCESS] Redeploy complete!"

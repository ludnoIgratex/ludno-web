name: Deploy Ludno UI

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - strapi_content_changed
  workflow_dispatch:

concurrency:
  group: ludno-production-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore sitemap content history
        uses: actions/cache/restore@v4
        with:
          path: .cache/sitemap-lastmod.json
          key: sitemap-lastmod-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sitemap-lastmod-v1-

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Restore CMS URL history
        uses: actions/cache/restore@v4
        with:
          path: .cache/cms-route-history.json
          key: cms-route-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cms-route-history-v1-

      - name: Recover CMS URL history if the cache expired
        if: hashFiles('.cache/cms-route-history.json') == ''
        run: |
          docker pull fijispawn/ludno-ui:latest
          CONTAINER_ID=$(docker create fijispawn/ludno-ui:latest)
          trap 'docker rm "$CONTAINER_ID"' EXIT
          mkdir -p .cache
          if docker cp "$CONTAINER_ID:/app/.cache/cms-route-history.json" .cache/cms-route-history.json; then
            echo "Recovered CMS URL history from the previous image."
          else
            echo "Previous image has no CMS URL history; using the checked-in baseline."
          fi

      - name: Recover sitemap history if the cache expired
        if: hashFiles('.cache/sitemap-lastmod.json') == ''
        run: |
          docker pull fijispawn/ludno-ui:latest
          CONTAINER_ID=$(docker create fijispawn/ludno-ui:latest)
          trap 'docker rm "$CONTAINER_ID"' EXIT
          mkdir -p .cache
          if docker cp "$CONTAINER_ID:/app/.cache/sitemap-lastmod.json" .cache/sitemap-lastmod.json; then
            echo "Recovered sitemap history from the previous image."
          else
            echo "Previous image has no sitemap history; establishing the initial baseline."
          fi

      - name: Test sitemap dates and CMS redirects
        run: node --test src/scripts/sitemap-lastmod.test.mjs src/scripts/cms-route-history.test.mjs src/server/canonical-routes.test.mjs

      - name: Build and push Docker image
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BUILD_ID=$(date +%s)
          docker build \
            --build-arg BUILD_CACHE_BUSTER="$BUILD_ID" \
            -t fijispawn/ludno-ui:$COMMIT_HASH \
            -t fijispawn/ludno-ui:latest \
            .
          docker push fijispawn/ludno-ui:$COMMIT_HASH
          docker push fijispawn/ludno-ui:latest

      - name: Extract updated sitemap content history
        run: |
          mkdir -p .cache
          CONTAINER_ID=$(docker create fijispawn/ludno-ui:latest)
          trap 'docker rm "$CONTAINER_ID"' EXIT
          docker cp "$CONTAINER_ID:/app/.cache/sitemap-lastmod.json" .cache/sitemap-lastmod.json
          docker cp "$CONTAINER_ID:/app/.cache/cms-route-history.json" .cache/cms-route-history.json

      - name: SSH and redeploy container
        uses: appleboy/ssh-action@v1.0.0
        env:
          UNISENDER_API_KEY: ${{ secrets.UNISENDER_API_KEY }}
          STRAPI_REBUILD_SECRET: ${{ secrets.STRAPI_REBUILD_SECRET }}
          REBUILD_DISPATCH_TOKEN: ${{ secrets.REBUILD_DISPATCH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: UNISENDER_API_KEY,STRAPI_REBUILD_SECRET,REBUILD_DISPATCH_TOKEN,GITHUB_REPOSITORY
          script: |
            echo "[INFO] Stopping and removing existing container..."
            docker rm -f my-ludno-ui || echo "[INFO] Container not running."

            echo "[INFO] Pulling latest Docker image..."
            docker pull fijispawn/ludno-ui:latest

            echo "[INFO] Starting new container..."
            docker run -d \
              --name my-ludno-ui \
              --restart unless-stopped \
              -p 8080:80 \
              -e UNISENDER_API_KEY="$UNISENDER_API_KEY" \
              -e UNISENDER_LIST_ID=3 \
              -e STRAPI_REBUILD_SECRET="$STRAPI_REBUILD_SECRET" \
              -e REBUILD_DISPATCH_TOKEN="$REBUILD_DISPATCH_TOKEN" \
              -e GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
              fijispawn/ludno-ui:latest

            echo "[SUCCESS] Redeploy complete!"

      - name: Save sitemap content history after deployment
        uses: actions/cache/save@v4
        with:
          path: .cache/sitemap-lastmod.json
          key: sitemap-lastmod-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save CMS URL history after deployment
        uses: actions/cache/save@v4
        with:
          path: .cache/cms-route-history.json
          key: cms-route-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
